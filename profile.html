<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | DriveGo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="images/logo.svg">
</head>
<body data-page="profile">

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo"><img src="images/logo.svg" class="logo-img" alt="">DriveGo</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">&#9776;</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="cars.html">Cars</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li data-auth="user"><a href="profile.html" class="active">Profile</a></li>
        <li data-auth="admin"><a href="admin.html">Admin</a></li>
        <li data-auth="guest"><a href="login.html">Login</a></li>
        <li data-auth="user"><a href="#" id="logoutBtn">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <!-- Содержимое <main> редактирует ТОЛЬКО владелец страницы -->
    <h1>My Profile</h1>

    <!-- Просмотр профиля -->
    <section class="profile-card">
      <div class="avatar" id="profileAvatar" aria-hidden="true"></div>
      <div class="profile-info">
        <h2 id="profileName"></h2>
        <ul class="profile-details">
          <li><strong>Email:</strong> <span id="profileEmail"></span></li>
          <li><strong>Phone:</strong> <span id="profilePhone"></span></li>
          <li><strong>Role:</strong> <span id="profileRole"></span></li>
        </ul>
        <button type="button" class="btn btn-primary" id="editProfileBtn">Edit Profile</button>
      </div>
    </section>

    <p class="success" id="profileMessage" hidden></p>

    <!-- Редактирование профиля -->
    <section class="admin-panel-box" id="editProfileBox" hidden>
      <h3>Edit Profile</h3>
      <form id="profileForm" novalidate>
        <div class="admin-form-grid">
          <div class="form-group">
            <label for="editFirstName">First Name</label>
            <input type="text" id="editFirstName" class="form-input">
          </div>
          <div class="form-group">
            <label for="editLastName">Last Name</label>
            <input type="text" id="editLastName" class="form-input">
          </div>
          <div class="form-group">
            <label for="editPhone">Phone (optional)</label>
            <input type="tel" id="editPhone" class="form-input" placeholder="+77011234567">
          </div>
        </div>
        <div class="admin-form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
        </div>
      </form>
    </section>

    <!-- История броней -->
    <section class="admin-section">
      <h2>My Bookings</h2>
      <p class="empty-text" id="noBookings" hidden>No bookings yet. <a href="cars.html">Browse cars</a></p>
      <div class="table-wrapper" id="bookingsTableWrapper">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Car</th>
              <th>Pickup</th>
              <th>Return</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="bookingsTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p><a href="about.html">About</a> | <a href="contact.html">Contact</a></p>
    <p><a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a> | <a href="https://facebook.com/" target="_blank" rel="noopener">Facebook</a> | <a href="https://t.me/" target="_blank" rel="noopener">Telegram</a></p>
    <p>&copy; 2026 Student Project</p>
  </footer>

  <script src="js/seed.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
