<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars | DriveGo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="icon" href="images/logo.svg">
</head>
<body data-page="cars">

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo"><img src="images/logo.svg" class="logo-img" alt="">DriveGo</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">&#9776;</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="cars.html" class="active">Cars</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li data-auth="user"><a href="profile.html">Profile</a></li>
        <li data-auth="admin"><a href="admin.html">Admin</a></li>
        <li data-auth="guest"><a href="login.html">Login</a></li>
        <li data-auth="user"><a href="#" id="logoutBtn">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="page-intro">
      <p class="eyebrow">Our fleet</p>
      <h1>Choose your car</h1>
      <p>From compact city cars to spacious SUVs, find a comfortable ride for your next trip.</p>
    </div>

    <section class="filter-bar" aria-label="Car search and filters">
      <div class="filter-search">
        <label class="sr-only" for="searchInput">Search cars</label>
        <input class="form-input" type="search" id="searchInput" placeholder="Search by car name">
      </div>
      <div>
        <label class="sr-only" for="categoryFilter">Category</label>
        <select class="form-input" id="categoryFilter">
          <option value="All">All categories</option>
        </select>
      </div>
      <div>
        <label class="sr-only" for="priceFilter">Price</label>
        <select class="form-input" id="priceFilter">
          <option value="0">Any price</option>
          <option value="50">Up to $50 / day</option>
          <option value="70">Up to $70 / day</option>
          <option value="100">Up to $100 / day</option>
        </select>
      </div>
      <button class="btn btn-primary" id="searchBtn" type="button">Search</button>
    </section>

    <p class="results-count" id="resultsCount" aria-live="polite"></p>
    <section class="cards-grid" id="carsGrid" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <p><a href="about.html">About</a> | <a href="contact.html">Contact</a></p>
    <p><a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a> | <a href="https://facebook.com/" target="_blank" rel="noopener">Facebook</a> | <a href="https://t.me/" target="_blank" rel="noopener">Telegram</a></p>
    <p>&copy; 2026 Student Project</p>
  </footer>

  <script src="js/seed.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
