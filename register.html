<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | DriveGo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo.svg">
</head>
<body data-page="register">

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo"><img src="images/logo.svg" class="logo-img" alt="">DriveGo</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">&#9776;</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="cars.html">Cars</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li data-auth="user"><a href="profile.html">Profile</a></li>
        <li data-auth="admin"><a href="admin.html">Admin</a></li>
        <li data-auth="guest"><a href="login.html" class="active">Login</a></li>
        <li data-auth="user"><a href="#" id="logoutBtn">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="form-box">
      <h1>Create account</h1>
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="regFirstName">First Name</label>
          <input type="text" id="regFirstName" class="form-input" autocomplete="given-name">
        </div>
        <div class="form-group">
          <label for="regLastName">Last Name</label>
          <input type="text" id="regLastName" class="form-input" autocomplete="family-name">
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" class="form-input" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="regPhone">Phone (optional)</label>
          <input type="tel" id="regPhone" class="form-input" autocomplete="tel">
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" class="form-input" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" class="form-input" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register</button>
        <p class="form-footer">Already have an account? <a href="login.html">Login</a></p>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p><a href="about.html">About</a> | <a href="contact.html">Contact</a></p>
    <p><a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a> | <a href="https://facebook.com/" target="_blank" rel="noopener">Facebook</a> | <a href="https://t.me/" target="_blank" rel="noopener">Telegram</a></p>
    <p>&copy; 2026 Student Project</p>
  </footer>

  <script src="js/seed.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
